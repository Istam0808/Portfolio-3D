    function FadeIn({ as = "div", delay = 0, duration = 0.7, x = 0, y = 30, className = "", children, ...props }) {
      if (motionApi.motion?.create) {
        const Tag = motionApi.motion.create(as);
        return (
          <Tag
            initial={{ opacity: 0, x, y }}
            whileInView={{ opacity: 1, x: 0, y: 0 }}
            viewport={{ once: true, margin: "50px", amount: 0 }}
            transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
            className={className}
            {...props}
          >
            {children}
          </Tag>
        );
      }

      const ref = useRef(null);
      useEffect(() => {
        const node = ref.current;
        if (!node) return;
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            window.setTimeout(() => node.classList.add("is-visible"), delay * 1000);
            observer.disconnect();
          }
        }, { rootMargin: "50px", threshold: 0 });
        observer.observe(node);
        return () => observer.disconnect();
      }, []);

      const Tag = as;
      return (
        <Tag
          ref={ref}
          className={`fade-base ${className}`}
          style={{ "--fx": `${x}px`, "--fy": `${y}px`, transitionDuration: `${duration}s` }}
          {...props}
        >
          {children}
        </Tag>
      );
    }

    function Magnet({ children, padding = 150, strength = 3, activeTransition = "transform 0.3s ease-out", inactiveTransition = "transform 0.6s ease-in-out" }) {
      const ref = useRef(null);
      const [transform, setTransform] = useState("translate3d(0,0,0)");
      const [transition, setTransition] = useState(inactiveTransition);

      function handleMove(event) {
        const node = ref.current;
        if (!node) return;
        const rect = node.getBoundingClientRect();
        const inside =
          event.clientX >= rect.left - padding &&
          event.clientX <= rect.right + padding &&
          event.clientY >= rect.top - padding &&
          event.clientY <= rect.bottom + padding;
        if (!inside) {
          setTransition(inactiveTransition);
          setTransform("translate3d(0,0,0)");
          return;
        }
        const x = (event.clientX - (rect.left + rect.width / 2)) / strength;
        const y = (event.clientY - (rect.top + rect.height / 2)) / strength;
        setTransition(activeTransition);
        setTransform(`translate3d(${x}px, ${y}px, 0)`);
      }

      useEffect(() => {
        window.addEventListener("mousemove", handleMove, { passive: true });
        return () => window.removeEventListener("mousemove", handleMove);
      }, []);

      return <div ref={ref} style={{ transform, transition, willChange: "transform" }}>{children}</div>;
    }

    function AnimatedText({ text }) {
      const ref = useRef(null);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        const onScroll = () => {
          const node = ref.current;
          if (!node) return;
          const rect = node.getBoundingClientRect();
          const start = window.innerHeight * 0.8;
          const end = window.innerHeight * 0.2;
          const raw = (start - rect.top) / (start - end + rect.height);
          setProgress(Math.max(0, Math.min(1, raw)));
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => {
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", onScroll);
        };
      }, []);

      return (
        <p ref={ref} className="relative mx-auto max-w-[560px] text-center text-[clamp(1rem,2vw,1.35rem)] font-medium leading-relaxed text-[#D7E2EA]">
          {text.split("").map((char, index) => {
            const start = index / text.length;
            const end = Math.min(1, start + 0.16);
            const local = Math.max(0, Math.min(1, (progress - start) / (end - start)));
            return (
              <span key={index} className="relative inline-block">
                <span style={{ opacity: 0 }}>{char === " " ? "\u00A0" : char}</span>
                <span className="absolute inset-0" style={{ opacity: 0.2 + local * 0.8 }}>{char === " " ? "\u00A0" : char}</span>
              </span>
            );
          })}
        </p>
      );
    }

        const section = trackRef.current?.closest("section");
        const onScroll = () => {
          if (!section) return;
          const sectionTop = section.offsetTop;
          setOffset((window.scrollY - sectionTop + window.innerHeight) * 0.3);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const translate = reverse ? -(offset - 200) : offset - 200;

      return (
        <div className="overflow-visible">
          <div ref={trackRef} className="flex w-max gap-3" style={{ transform: `translateX(${translate}px)`, willChange: "transform" }}>
            {tripled.map((src, index) => (

            ))}

      );

          const rect = node.getBoundingClientRect();
          const progress = Math.max(0, Math.min(1, (96 - rect.top) / window.innerHeight));
          setScale(1 - progress * (1 - targetScale));
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      return (
        <div className="relative h-[85vh]">
          <article
            ref={ref}
            className="sticky rounded-[40px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:rounded-[50px] sm:p-6 md:rounded-[60px] md:p-8"
            style={{ top: `calc(6rem + ${index * 28}px)`, transform: `scale(${scale})`, transformOrigin: "top center", willChange: "transform" }}
          >
            <div className="mb-6 grid items-end gap-5 md:grid-cols-[auto_1fr_auto] md:gap-8">
              <div className="text-[clamp(3rem,10vw,140px)] font-black leading-none text-[#D7E2EA]">{project.no}</div>
              <div className="pb-2">
                <div className="mb-2 text-sm font-medium uppercase tracking-widest text-[#D7E2EA]/60">{project.category}</div>
                <h3 className="text-[clamp(1.6rem,5vw,5.5rem)] font-black uppercase leading-none tracking-tight text-[#D7E2EA]">{project.name}</h3>
              </div>
              <div className="pb-2"><LiveProjectButton href={project.projectUrl} /></div>
            </div>

            <div className="grid gap-4 md:grid-cols-[40%_60%]">
              <div className="grid gap-4">
                <img src={project.images[0]} alt={`${project.name} preview one`} loading="lazy" className="h-[clamp(130px,16vw,230px)] w-full rounded-[40px] object-cover sm:rounded-[50px] md:rounded-[60px]" />
                <img src={project.images[1]} alt={`${project.name} preview two`} loading="lazy" className="h-[clamp(160px,22vw,340px)] w-full rounded-[40px] object-cover sm:rounded-[50px] md:rounded-[60px]" />
              </div>
              <img src={project.images[2]} alt={`${project.name} main preview`} loading="lazy" className="h-[calc(clamp(130px,16vw,230px)+clamp(160px,22vw,340px)+1rem)] w-full rounded-[40px] object-cover sm:rounded-[50px] md:rounded-[60px]" />
            </div>
          </article>
        </div>
      );
    }

    function ProjectsSection({ onContactClick }) {
      return (
        <section id="projects" className="relative z-10 -mt-10 rounded-t-[40px] bg-[#0C0C0C] px-5 py-20 sm:-mt-12 sm:rounded-t-[50px] sm:px-8 sm:py-24 md:-mt-14 md:rounded-t-[60px] md:px-10 md:py-32">
          <FadeIn y={40}>
            <h2 className="hero-heading mb-16 text-center text-[clamp(3rem,12vw,160px)] font-black uppercase leading-none tracking-tight sm:mb-20 md:mb-28">Projects</h2>
          </FadeIn>
          <div className="mx-auto max-w-7xl">
            {projects.map((project, index) => <ProjectCard key={project.no} project={project} index={index} total={projects.length} />)}
          </div>
          <div id="contact" className="mx-auto mt-8 flex max-w-7xl items-center justify-between border-t border-[#D7E2EA]/20 pt-10">
            <p className="max-w-xl text-[clamp(1.3rem,3vw,3rem)] font-light uppercase leading-tight text-[#D7E2EA]">Ready for a 3D identity with weight, motion, and character?</p>
            <ContactButton onClick={onContactClick} />
          </div>
        </section>
      );
    }

    function App() {
      const [isContactOpen, setIsContactOpen] = useState(false);

      useEffect(() => {
        document.body.style.overflow = isContactOpen ? "hidden" : "";
        const onKeyDown = (event) => {
          if (event.key === "Escape") setIsContactOpen(false);
        };
        window.addEventListener("keydown", onKeyDown);
        return () => {
          document.body.style.overflow = "";
          window.removeEventListener("keydown", onKeyDown);
        };
      }, [isContactOpen]);

      return (
        <main className="main-wrap">
          <HeroSection onContactClick={() => setIsContactOpen(true)} />
          <MarqueeSection />
          <AboutSection onContactClick={() => setIsContactOpen(true)} />
          <ServicesSection />
          <ProjectsSection onContactClick={() => setIsContactOpen(true)} />
          <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} />
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
